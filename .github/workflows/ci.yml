name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Default rustfmt
        run: cargo fmt --all -- --check
      - name: Rust tests and structural build-time lint
        run: cargo test --locked --all-targets
      - name: Structural linter self-tests
        run: |
          rustc --test source_lints/mod.rs -o "${RUNNER_TEMP}/skrynia-lint-tests"
          "${RUNNER_TEMP}/skrynia-lint-tests"
      - name: GitHub deployment action smoke
        run: bash tests/ssh/action_smoke.sh
      - name: Clippy (zero warnings)
        run: cargo clippy --locked --all-targets -- -D warnings

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Browser Wasm compilation
        run: cargo check --locked --target wasm32-unknown-unknown --lib --no-default-features
      - name: Build browser Wasm release
        run: cargo build --locked --release --target wasm32-unknown-unknown --lib --no-default-features
      - name: Install matching wasm-bindgen CLI
        run: cargo install --locked wasm-bindgen-cli --version 0.2.130
      - name: Generate browser JS bindings
        run: wasm-bindgen --target web --out-dir dist/skrynia-wasm target/wasm32-unknown-unknown/release/skrynia_tools.wasm
      - name: Assemble and validate installable browser npm package
        run: bash tests/browser/package.sh
      - name: Headless browser Wasm protocol integration
        run: bash tests/browser/run.sh
      - uses: actions/upload-artifact@v4
        with:
          name: skrynia-tools-browser-wasm
          path: dist/skrynia-wasm/

  ssh-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install OpenSSH server for isolated integration
        run: |
          if ! command -v sshd; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq openssh-server
          fi
          sudo mkdir -p /run/sshd
      - name: Real SSH deployment and refusal tests
        run: bash tests/ssh/integration.sh

  skrynia-protocol-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: ottojung/Skrynia
          ref: 3139a82fe4a0292d75cc55c49f6a8bb9e6ff7b47
          path: upstream-skrynia
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            upstream-skrynia -> target
      - name: Build pinned real Skrynia Rust server
        run: cargo build --locked --release --manifest-path upstream-skrynia/Cargo.toml -p skrynia-server
      - name: Real Skrynia event-set and CAS-snapshot integration
        run: |
          SKRYNIA_TEST_SERVER_BIN="$(pwd)/upstream-skrynia/target/release/skrynia-server" \
            bash tests/ssh/protocols_live.sh
