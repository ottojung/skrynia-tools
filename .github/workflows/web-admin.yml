name: Web administration integration

on:
  push:
    branches: [main]
    paths:
      - "deploy.sh"
      - "bootstrap/**"
      - "web-admin/**"
      - "tests/web-admin/**"
      - ".github/workflows/web-admin.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encrypted-admin-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: ottojung/Skrynia
          ref: 10cbf0d5ad00224e1375a4f2482965f8d3513559
          path: .deps/skrynia
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .deps/skrynia -> target
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build real Skrynia Rust server
        run: cargo build --locked -p skrynia-server --manifest-path .deps/skrynia/Cargo.toml
      - name: Bash, JavaScript and failure-injection checks
        run: |
          bash -n deploy.sh tests/web-admin/live.sh
          for file in bootstrap/*.mjs web-admin/*.js tests/web-admin/*.mjs; do
            node --check "$file"
          done
          node tests/web-admin/faults.mjs
      - name: Chromium encrypted-vault and grant lifecycle
        env:
          SKRYNIA_TEST_SERVER_BIN: ${{ github.workspace }}/.deps/skrynia/target/debug/skrynia-server
          SKRYNIA_TEST_BROWSER: "1"
          CHROME_BIN: google-chrome
        run: bash tests/web-admin/live.sh
