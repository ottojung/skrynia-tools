[package]
name = "skrynia-publish-provider"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
publish = false
description = "Private publication syscall provider for Skrynia disk and nginx roots"

[lib]
name = "skrynia_publish_provider"
path = "src/lib.rs"

[[bin]]
name = "skrynia-publish-provider"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
libc = "0.2"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
tempfile = "3"
