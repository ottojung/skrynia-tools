[package]
name = "webpush-sender"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Standalone least-privilege outbound WebPush sender (no kernel/P0/P1 changes)"

# Standalone crate: intentionally not a member of the tools workspace.
[workspace]

[dependencies]
aes-gcm = "0.11"
base64ct = { version = "1.8", features = ["alloc"] }
hkdf = "0.12"
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }
libc = "0.2.191"

# Non-default, test-only. Enables the loopback TLS adapter that injects a
# disposable CA/connect port. NEVER enable in a production/release build: the
# production path must keep the built-in webpki roots and global-IP pinning.
[features]
test-transport = []

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
