[package]
name = "skrynia-tools"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"
license = "AGPL-3.0-or-later"
description = "Skrynia client protocols and web application administration"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
skrynia-program0 = { path = "program0" }
anyhow = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
thiserror = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
url = "2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Request", "RequestInit", "Headers", "Response", "RequestCache", "RequestRedirect"] }

[workspace]
members = [".", "program0"]
resolver = "2"

[dev-dependencies]
skrynia-program0 = { path = "program0" }
wat = "1"

[[test]]
name = "v3_live"
path = "tests/v3_live/mod.rs"

[[test]]
name = "v2_read_parity"
path = "tests/v2_read_parity/mod.rs"

[[test]]
name = "v2_durable"
path = "tests/v2_durable/mod.rs"

[[test]]
name = "v2_p0_bridge"
path = "tests/v2_p0_bridge/mod.rs"
