[package]
name = "skrynia-v2-provider"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-or-later"
description = "Optional unprivileged Skrynia v2 API provider program"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
skrynia-tools = { path = "..", features = ["guest-core-only"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
wat = "1"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
