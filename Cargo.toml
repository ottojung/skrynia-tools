[package]
name = "skrynia-tools"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"
license = "AGPL-3.0-or-later"
description = "Skrynia client protocols and GitHub application deployment"

[dependencies]
anyhow = "1"
libc = "0.2"
hex = "0.4"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
