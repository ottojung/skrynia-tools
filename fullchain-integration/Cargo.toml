[package]
name = "skrynia-fullchain-integration"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Disposable full-chain WebPush acceptance harness: real kernel PR125 + dumb P0 + push P1 WASM via trusted edge + real sender"

[workspace]

[dependencies]
webpush-sender = { path = "../webpush-sender", features = ["test-transport"] }
aes-gcm = "0.11"
base64ct = { version = "1.8", features = ["alloc"] }
hkdf = "0.12"
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[[bin]]
name = "fullchain"
path = "src/main.rs"
