name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Default rustfmt
        run: cargo fmt --all -- --check
      - name: Rust tests and structural build-time lint
        run: cargo test --locked --all-targets
      - name: Structural linter self-tests
        run: |
          rustc --test source_lints/mod.rs -o "${RUNNER_TEMP}/skrynia-lint-tests"
          "${RUNNER_TEMP}/skrynia-lint-tests"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stable application bootstrap tests
        run: node tests/http/landing.mjs
      - name: HTTP deployment action tests
        run: |
          bash -n action/deploy/build.sh
          node --check action/deploy/upload.mjs
          node --check action/publish-stable/upload.mjs
          bash tests/http/action_smoke.sh
      - name: Clippy (zero warnings)
        run: cargo clippy --locked --all-targets -- -D warnings

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Browser Wasm compilation
        run: cargo check --locked --target wasm32-unknown-unknown --lib --no-default-features
      - name: Build browser Wasm release
        run: cargo build --locked --release --target wasm32-unknown-unknown --lib --no-default-features
      - name: Install matching wasm-bindgen CLI
        run: cargo install --locked wasm-bindgen-cli --version 0.2.130
      - name: Generate browser JS bindings
        run: wasm-bindgen --target web --out-dir dist/skrynia-wasm target/wasm32-unknown-unknown/release/skrynia_tools.wasm
      - name: Assemble and validate installable browser npm package
        run: bash tests/browser/package.sh
      - name: Headless browser Wasm protocol integration
        run: bash tests/browser/run.sh
      - uses: actions/upload-artifact@v4
        with:
          name: skrynia-tools-browser-wasm
          path: dist/skrynia-wasm/

  browser-engines:
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Install pinned cross-engine browser harness
        run: npm ci --prefix tests/browser
      - name: Install Firefox and WebKit with system dependencies
        run: ./tests/browser/node_modules/.bin/playwright install --with-deps firefox webkit
      - uses: actions/download-artifact@v4
        with:
          name: skrynia-tools-browser-wasm
          path: dist/skrynia-wasm
      - name: Headless Firefox and WebKit Wasm protocol integration
        run: node tests/browser/cross_browser.mjs

  skrynia-protocol-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: ottojung/Skrynia
          ref: 10cbf0d5ad00224e1375a4f2482965f8d3513559
          path: upstream-skrynia
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            upstream-skrynia -> target
      - name: Build pinned real Skrynia Rust server
        run: cargo build --locked --release --manifest-path upstream-skrynia/Cargo.toml -p skrynia-server
      - name: Real Skrynia optional-protocol integration
        env:
          SKRYNIA_TEST_SERVER_BIN: ${{ github.workspace }}/upstream-skrynia/target/release/skrynia-server
        run: bash tests/http/protocols_live.sh

  publish-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            publish-provider -> publish-provider/target
      - name: Provider default rustfmt
        run: cargo fmt --manifest-path publish-provider/Cargo.toml --all -- --check
      - name: Provider real HTTP tests
        run: cargo test --locked --all-targets --manifest-path publish-provider/Cargo.toml
      - name: Provider clippy (zero warnings)
        run: cargo clippy --locked --all-targets --manifest-path publish-provider/Cargo.toml -- -D warnings
      - name: Build provider container image
        run: docker build -f publish-provider/Dockerfile -t skrynia-publish-provider:ci .
      - name: Real container HTTP smoke
        env:
          CONTAINER_ENGINE: docker
        run: bash publish-provider/container_smoke.sh skrynia-publish-provider:ci
