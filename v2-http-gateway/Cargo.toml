[package]
name = "skrynia-v2-http-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-or-later"
description = "Loopback-only trusted external v2 HTTP to v3 POST adapter"

[dependencies]
skrynia-tools = { path = ".." }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_json = "1"
libc = "0.2"

[dev-dependencies]
rand = "0.9"
