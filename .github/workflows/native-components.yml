name: Native components
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-components:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Full-chain harness host tests
        run: cargo test --manifest-path fullchain-integration/Cargo.toml --locked
  compiled-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: ottojung/Skrynia
          ref: db08cbc7496fafedc6a2e32df80395911b930879
          path: upstream-skrynia
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            upstream-skrynia -> target
            v3-trusted-edge-gateway -> target
      - name: Build generic kernel
        working-directory: upstream-skrynia
        run: cargo build --locked --release -p libskrynia --bin skrynia-server
      - name: Kernel generic eval and callback regressions
        working-directory: upstream-skrynia
        run: |
          set -eu
          cargo test --locked -p libskrynia --test vm eval:: -- --list > "$RUNNER_TEMP/eval-tests.txt"
          grep -q '^eval::.*: test$' "$RUNNER_TEMP/eval-tests.txt"
          cargo test --locked -p libskrynia --test vm eval::
      - name: Build ordinary guests
        env:
          RUSTFLAGS: "-C link-arg=--export-table -C opt-level=z -C strip=symbols"
        run: |
          cargo +1.93.0 build --locked --release --target wasm32-unknown-unknown -p skrynia-program0
          cargo +1.93.0 build --locked --release --target wasm32-unknown-unknown -p skrynia-native-service --features cb-guest
      - name: Check guest import surface and arena fit
        run: |
          python3 native-service/integration/verify_target_wasm.py target/wasm32-unknown-unknown/release/skrynia_native_service.wasm
          test "$(wc -c < target/wasm32-unknown-unknown/release/skrynia_native_service.wasm)" -lt 2096000
      - name: Compiled Program0 operator-root isolation
        run: |
          rustc +1.93.0 --edition=2024 --target wasm32-unknown-unknown \
            --crate-type cdylib -C opt-level=s -C panic=abort -C strip=symbols \
            tests/v3_proxy/callback/probe.rs -o "$RUNNER_TEMP/scope-probe.wasm"
          python3 tests/v3_proxy/callback/real_scope.py \
            --kernel "$PWD/upstream-skrynia/target/release/skrynia-server" \
            --p0 "$PWD/target/wasm32-unknown-unknown/release/skrynia_program0.wasm" \
            --guest "$RUNNER_TEMP/scope-probe.wasm"
      - name: Real descriptor, random-byte and shared-lease regressions
        run: |
          set -eu
          KERNEL="$PWD/upstream-skrynia/target/release/skrynia-server"
          P0="$PWD/target/wasm32-unknown-unknown/release/skrynia_program0.wasm"
          for fixture in descriptor_guest random_guest t10_lock_guest; do
            rustc +1.93.0 --edition=2024 --target wasm32-unknown-unknown --crate-type cdylib -C opt-level=s -C panic=abort -C strip=symbols "program0/integration/guests/${fixture}.rs" -o "$RUNNER_TEMP/${fixture}.wasm"
          done
          python3 program0/integration/target_p0_ops.py --kernel "$KERNEL" --p0 "$P0" --guest "$RUNNER_TEMP/descriptor_guest.wasm"
          python3 program0/integration/target_p0_ops.py --kernel "$KERNEL" --p0 "$P0" --guest "$RUNNER_TEMP/random_guest.wasm" --want RANDOM_OK --label random
          python3 program0/integration/t10_lock_http.py --kernel "$KERNEL" --p0 "$P0" --guest "$RUNNER_TEMP/t10_lock_guest.wasm"
      - name: Real compiled nested callback and failure recovery
        run: |
          set -eu
          KERNEL="$PWD/upstream-skrynia/target/release/skrynia-server"
          P0="$PWD/target/wasm32-unknown-unknown/release/skrynia_program0.wasm"
          P1="$PWD/target/wasm32-unknown-unknown/release/skrynia_native_service.wasm"
          for fixture in probe invalid; do
            rustc +1.93.0 --edition=2024 --target wasm32-unknown-unknown --crate-type cdylib -C opt-level=s -C panic=abort -C strip=symbols "native-service/integration/nested/${fixture}.rs" -o "$RUNNER_TEMP/nested-${fixture}.wasm"
          done
          PROBE="$RUNNER_TEMP/nested-probe.wasm"
          INVALID="$RUNNER_TEMP/nested-invalid.wasm"
          python3 native-service/integration/nested/nested_cb.py --kernel "$KERNEL" --p0 "$P0" --p1 "$P1" --probe "$PROBE" --invalid "$INVALID" \
            --kernel-sha256 "$(sha256sum "$KERNEL" | cut -d' ' -f1)" --p0-sha256 "$(sha256sum "$P0" | cut -d' ' -f1)" --p1-sha256 "$(sha256sum "$P1" | cut -d' ' -f1)" \
            --probe-sha256 "$(sha256sum "$PROBE" | cut -d' ' -f1)" --invalid-sha256 "$(sha256sum "$INVALID" | cut -d' ' -f1)"
      - name: Build current Theorem P2 guest
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          RUSTFLAGS: "-C link-arg=--export-table -C opt-level=z -C strip=symbols"
        run: cargo +1.93.0 build --locked --release --target wasm32-unknown-unknown --manifest-path examples/theorem_lab_feedback_p2/Cargo.toml
      - name: Real compiled registry recovery (interrupted stage and I/O obstruction)
        run: |
          python3 tests/v3_proxy/registry_recovery.py \
            --kernel "$PWD/upstream-skrynia/target/release/skrynia-server" \
            --p0 "$PWD/target/wasm32-unknown-unknown/release/skrynia_program0.wasm" \
            --p1 "$PWD/target/wasm32-unknown-unknown/release/skrynia_native_service.wasm" \
            --guest "$PWD/target/wasm32-unknown-unknown/release/theorem_lab_feedback_p2.wasm"
      - name: Real compiled-stack P2 adversarial fixture
        run: |
          set -eu
          KERNEL="$PWD/upstream-skrynia/target/release/skrynia-server"
          P0="$PWD/target/wasm32-unknown-unknown/release/skrynia_program0.wasm"
          P1="$PWD/target/wasm32-unknown-unknown/release/skrynia_native_service.wasm"
          P2="$PWD/target/wasm32-unknown-unknown/release/theorem_lab_feedback_p2.wasm"
          python3 examples/theorem_lab_feedback_p2/tests/real_kit_p2.py \
            --kernel "$KERNEL" --p0 "$P0" --p1 "$P1" --p2 "$P2" \
            --kernel-sha256 "$(sha256sum "$KERNEL" | cut -d' ' -f1)" \
            --p0-sha256 "$(sha256sum "$P0" | cut -d' ' -f1)" \
            --p1-sha256 "$(sha256sum "$P1" | cut -d' ' -f1)" \
            --p2-sha256 "$(sha256sum "$P2" | cut -d' ' -f1)"
      - name: Compiled service and build exact kit
        run: |
          export SKRYNIA_REQUIRE_KIT=1
          export SKRYNIA_V3_SERVER_BIN="$PWD/upstream-skrynia/target/release/skrynia-server"
          export SKRYNIA_V3_PROGRAM0_WASM="$PWD/target/wasm32-unknown-unknown/release/skrynia_program0.wasm"
          export SKRYNIA_V3_NATIVE_SERVICE_WASM="$PWD/target/wasm32-unknown-unknown/release/skrynia_native_service.wasm"
          git rev-parse HEAD
          git -C upstream-skrynia rev-parse HEAD
          sha256sum "$SKRYNIA_V3_SERVER_BIN" "$SKRYNIA_V3_PROGRAM0_WASM" "$SKRYNIA_V3_NATIVE_SERVICE_WASM"
          export FC_ARTIFACTS="$RUNNER_TEMP/skrynia-fullchain-artifacts"
          mkdir "$FC_ARTIFACTS"
          cargo +1.93.0 test --manifest-path v3-trusted-edge-gateway/Cargo.toml --locked --test compiled_service -- --test-threads=1
          install -m 700 "$SKRYNIA_V3_SERVER_BIN" "$FC_ARTIFACTS/kernel"
          install -m 700 v3-trusted-edge-gateway/target/debug/skrynia-v3-trusted-edge-gateway "$FC_ARTIFACTS/edge"
          cp "$SKRYNIA_V3_PROGRAM0_WASM" "$FC_ARTIFACTS/root.wasm"
          cp "$SKRYNIA_V3_NATIVE_SERVICE_WASM" "$FC_ARTIFACTS/service.wasm"
          cp "$PWD/target/wasm32-unknown-unknown/release/theorem_lab_feedback_p2.wasm" "$FC_ARTIFACTS/theorem_lab_feedback_p2.wasm"
          # fullchain-integration validates SHA256SUMS as an exact 5-entry roster.
          # Keep it to those 5; publish P2 digest separately for downstream reuse.
          (cd "$FC_ARTIFACTS"; sha256sum kernel root.wasm service.wasm edge echo.wasm > SHA256SUMS)
          (cd "$FC_ARTIFACTS"; sha256sum theorem_lab_feedback_p2.wasm > SHA256SUMS.p2)
          {
            echo "tools_head=$(git rev-parse HEAD)"
            echo "kernel_head=$(git -C upstream-skrynia rev-parse HEAD)"
            echo "kernel=db08cbc7496fafedc6a2e32df80395911b930879"
            echo "sha256_kernel=$(sha256sum "$SKRYNIA_V3_SERVER_BIN" | cut -d' ' -f1)"
            echo "sha256_p0=$(sha256sum "$SKRYNIA_V3_PROGRAM0_WASM" | cut -d' ' -f1)"
            echo "sha256_p1=$(sha256sum "$SKRYNIA_V3_NATIVE_SERVICE_WASM" | cut -d' ' -f1)"
            echo "sha256_edge=$(sha256sum v3-trusted-edge-gateway/target/debug/skrynia-v3-trusted-edge-gateway | cut -d' ' -f1)"
            echo "sha256_echo=$(sha256sum "$FC_ARTIFACTS/echo.wasm" | cut -d' ' -f1)"
            echo "sha256_p2=$(sha256sum "$FC_ARTIFACTS/theorem_lab_feedback_p2.wasm" | cut -d' ' -f1)"
          } > "$FC_ARTIFACTS/COMMIT_MANIFEST.txt"
          python3 tests/v3_proxy/verify_kit.py --kit "$FC_ARTIFACTS" --tools-head "$(git rev-parse HEAD)" --kernel-head db08cbc7496fafedc6a2e32df80395911b930879
      - name: Upload exact compiled stack (reuse by downstream CI)
        uses: actions/upload-artifact@v4
        with:
          name: exact-compiled-stack-db08cbc
          path: ${{ runner.temp }}/skrynia-fullchain-artifacts/
          if-no-files-found: error

  trusted-edge-tests:
    needs: [compiled-stack]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: exact-compiled-stack-db08cbc
          path: ${{ runner.temp }}/exact-stack
      - name: Verify source and artifact pins
        run: |
          A="$RUNNER_TEMP/exact-stack"
          python3 tests/v3_proxy/verify_kit.py --kit "$A" --tools-head "$(git rev-parse HEAD)" --kernel-head db08cbc7496fafedc6a2e32df80395911b930879
          chmod 700 "$A/kernel" "$A/edge"
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: v3-trusted-edge-gateway -> target
      - name: Real trusted-edge streaming and liveness
        run: |
          A="$RUNNER_TEMP/exact-stack"
          export SKRYNIA_REQUIRE_KIT=1
          export SKRYNIA_V3_SERVER_BIN="$A/kernel"
          export SKRYNIA_V3_PROGRAM0_WASM="$A/root.wasm"
          export SKRYNIA_V3_NATIVE_SERVICE_WASM="$A/service.wasm"
          cargo +1.93.0 test --manifest-path v3-trusted-edge-gateway/Cargo.toml --locked --tests -- --test-threads=1

  fullchain:
    needs: [compiled-stack]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: exact-compiled-stack-db08cbc
          path: ${{ runner.temp }}/exact-stack
      - name: Verify source and artifact pins
        run: |
          A="$RUNNER_TEMP/exact-stack"
          python3 tests/v3_proxy/verify_kit.py --kit "$A" --tools-head "$(git rev-parse HEAD)" --kernel-head db08cbc7496fafedc6a2e32df80395911b930879
          chmod 700 "$A/kernel" "$A/edge"
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fullchain-integration -> target
      - name: Real full-chain Web Push and ordinary service
        shell: bash
        run: |
          set -euo pipefail
          export FC_ARTIFACTS="$RUNNER_TEMP/exact-stack"
          cargo +1.93.0 run --manifest-path fullchain-integration/Cargo.toml --locked 2>&1 | tee "$RUNNER_TEMP/fullchain.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fullchain-evidence
          path: ${{ runner.temp }}/fullchain.log
          if-no-files-found: warn

  scale-1000:
    needs: [compiled-stack]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: exact-compiled-stack-db08cbc
          path: ${{ runner.temp }}/exact-stack
      - name: Verify source and artifact pins
        run: |
          A="$RUNNER_TEMP/exact-stack"
          python3 tests/v3_proxy/verify_kit.py --kit "$A" --tools-head "$(git rev-parse HEAD)" --kernel-head db08cbc7496fafedc6a2e32df80395911b930879
          chmod 700 "$A/kernel" "$A/edge"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 1000-version / restart exact-stack acceptance (real compiled kit)
        shell: bash
        run: |
          set -euxo pipefail
          A="$RUNNER_TEMP/exact-stack"
          for f in kernel root.wasm service.wasm echo.wasm edge; do
            test -s "$A/$f"
          done
          sha256sum "$A/"*
          export SKRYNIA_KERNEL_OVERRIDE="$A/kernel"
          export SKRYNIA_KERNEL_SHA256_OVERRIDE=$(sha256sum "$A/kernel" | cut -d' ' -f1)
          export SKRYNIA_P0_OVERRIDE="$A/root.wasm"
          export SKRYNIA_P0_SHA256_OVERRIDE=$(sha256sum "$A/root.wasm" | cut -d' ' -f1)
          export SKRYNIA_P1_OVERRIDE="$A/service.wasm"
          export SKRYNIA_P1_SHA256_OVERRIDE=$(sha256sum "$A/service.wasm" | cut -d' ' -f1)
          export SKRYNIA_ECHO_OVERRIDE="$A/echo.wasm"
          export SKRYNIA_ECHO_SHA256_OVERRIDE=$(sha256sum "$A/echo.wasm" | cut -d' ' -f1)
          export SKRYNIA_EDGE_GATEWAY_OVERRIDE="$A/edge"
          export SKRYNIA_EDGE_GATEWAY_SHA256_OVERRIDE=$(sha256sum "$A/edge" | cut -d' ' -f1)
          export SKRYNIA_GIT_HEAD="$(git rev-parse HEAD)"
          export E2E_EVIDENCE_OUT="$RUNNER_TEMP/scale-1000.json"
          node tests/web-admin-v3/p1_admin_scale_1000.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scale-1000-evidence
          path: ${{ runner.temp }}/scale-1000.json
          if-no-files-found: warn

  enospc-recovery:
    # Genuine ENOSPC on a private, disposable 8 MiB tmpfs. Reuses the exact
    # compiled stack built by compiled-stack (explicit-root K10 kernel, P0/P1/P2/edge).
    # No kernel or guest rebuild; no shared-host fills and no privileged mounts
    # outside this disposable runner. sudo is used only for mount/umount of VOL.
    needs: [compiled-stack]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: exact-compiled-stack-db08cbc
          path: ${{ runner.temp }}/exact-stack
      - name: Pin exact source, kernel source and artifact hashes
        shell: bash
        run: |
          set -euo pipefail
          A="$RUNNER_TEMP/exact-stack"
          (cd "$A" && sha256sum -c SHA256SUMS && sha256sum -c SHA256SUMS.p2)
          grep -qx 'kernel=db08cbc7496fafedc6a2e32df80395911b930879' "$A/COMMIT_MANIFEST.txt"
          grep -qx 'kernel_head=db08cbc7496fafedc6a2e32df80395911b930879' "$A/COMMIT_MANIFEST.txt"
          # The compiled artifact and this job check out the same workflow commit.
          grep -qx "tools_head=$(git rev-parse HEAD)" "$A/COMMIT_MANIFEST.txt"
          python3 tests/v3_proxy/verify_kit.py --kit "$A" --tools-head "$(git rev-parse HEAD)" --kernel-head db08cbc7496fafedc6a2e32df80395911b930879
      - name: Unit-test ENOSPC harness (safe, no mounts or fills)
        run: python3 tests/v3_proxy/enospc_recovery.py --self-test
      - name: Genuine ENOSPC on private tmpfs (real compiled ordinary P1)
        shell: bash
        run: |
          set -euxo pipefail
          A="$RUNNER_TEMP/exact-stack"
          VOL="$RUNNER_TEMP/skrynia-enospc-volume"
          LOGS="$RUNNER_TEMP/skrynia-enospc-logs"
          mkdir -p "$VOL" "$LOGS"
          cleanup() {
            sudo umount "$VOL" 2>/dev/null || true
            rm -rf "$VOL"
          }
          trap cleanup EXIT
          sudo mount -t tmpfs -o size=8m,nosuid,nodev,noexec tmpfs "$VOL"
          df -hT "$VOL"
          chmod 700 "$A/kernel"
          python3 tests/v3_proxy/enospc_recovery.py \
            --kernel "$A/kernel" \
            --p0 "$A/root.wasm" \
            --p1 "$A/service.wasm" \
            --guest "$A/theorem_lab_feedback_p2.wasm" \
            --volume "$VOL" \
            --log-dir "$LOGS" \
            --manifest "$A/COMMIT_MANIFEST.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enospc-recovery-log
          path: ${{ runner.temp }}/skrynia-enospc-logs/kernel.log
          if-no-files-found: warn

  publication-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: ottojung/Skrynia
          # Target-ABI kernel: typed /syscalls_list discovery and byte-scalar
          # root imports. Pre-typed kernels reject the {"functions": ...} body.
          ref: db08cbc7496fafedc6a2e32df80395911b930879
          path: upstream-skrynia
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            upstream-skrynia -> target
      - name: Install real nginx for the publication chain
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx
      - name: Build real kernel, provider and produced root WASM
        run: |
          set -eu
          cargo build --locked --release --manifest-path upstream-skrynia/Cargo.toml -p libskrynia --bin skrynia-server
          cargo +1.93.0 build --locked --release --manifest-path publish-provider/Cargo.toml
          cargo +1.93.0 build --locked --release --target wasm32-unknown-unknown \
            -p skrynia-publication-root -p skrynia-program0
          python3 publication-root/tests/check_wasm_abi.py \
            --root target/wasm32-unknown-unknown/release/skrynia_publication_root.wasm \
            --generic-p0 target/wasm32-unknown-unknown/release/skrynia_program0.wasm
      - name: Real WASM publication lifecycle with kernel, provider and nginx
        run: |
          python3 publication-root/tests/real_wasm_chain.py \
            --kernel "$PWD/upstream-skrynia/target/release/skrynia-server" \
            --provider "$PWD/publish-provider/target/release/skrynia-publish-provider" \
            --root "$PWD/target/wasm32-unknown-unknown/release/skrynia_publication_root.wasm" \
            --overlap-total 300 --overlap-workers 8 \
            --results "$RUNNER_TEMP/wasm-publication-results.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasm-publication-results
          path: ${{ runner.temp }}/wasm-publication-results.json
  chromium-admin-e2e:
    # Reuses the exact artifacts built by compiled-stack (explicit-root K10 kernel,
    # P0/P1/edge/echo) rather than duplicating a kernel/guest build.
    needs: [compiled-stack]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: exact-compiled-stack-db08cbc
          path: ${{ runner.temp }}/exact-stack
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve exact artifact digests
        id: shas
        run: |
          set -eu
          A="$RUNNER_TEMP/exact-stack"
          KERNEL="$A/kernel"; P0="$A/root.wasm"; P1="$A/service.wasm"
          GW="$A/edge"; ECHO="$A/echo.wasm"
          P2="$A/theorem_lab_feedback_p2.wasm"
          for f in "$KERNEL" "$P0" "$P1" "$GW" "$ECHO" "$P2"; do test -s "$f" || { echo "missing $f" >&2; exit 1; }; done
          # Artifact upload/download strips executable bits; restore for spawn.
          chmod 700 "$KERNEL" "$GW"
          # Verify against the SHA256SUMS produced by compiled-stack.
          (cd "$A" && sha256sum -c SHA256SUMS && sha256sum -c SHA256SUMS.p2)
          python3 tests/v3_proxy/verify_kit.py --kit "$A" --tools-head "$(git rev-parse HEAD)" --kernel-head db08cbc7496fafedc6a2e32df80395911b930879
          echo "kernel=$KERNEL" >> "$GITHUB_OUTPUT"
          echo "p0=$P0" >> "$GITHUB_OUTPUT"
          echo "p1=$P1" >> "$GITHUB_OUTPUT"
          echo "gw=$GW" >> "$GITHUB_OUTPUT"
          echo "echo=$ECHO" >> "$GITHUB_OUTPUT"
          echo "p2=$P2" >> "$GITHUB_OUTPUT"
          echo "kernel_sha=$(sha256sum "$KERNEL" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "p0_sha=$(sha256sum "$P0" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "p1_sha=$(sha256sum "$P1" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "gw_sha=$(sha256sum "$GW" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "echo_sha=$(sha256sum "$ECHO" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "p2_sha=$(sha256sum "$P2" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          {
            echo "## Exact compiled stack (reused from compiled-stack)"
            echo "tools_head=$(git rev-parse HEAD)"
            cat "$A/COMMIT_MANIFEST.txt"
            echo "sha256_kernel=$(sha256sum "$KERNEL" | cut -d' ' -f1)"
            echo "sha256_p0=$(sha256sum "$P0" | cut -d' ' -f1)"
            echo "sha256_p1=$(sha256sum "$P1" | cut -d' ' -f1)"
            echo "sha256_gateway=$(sha256sum "$GW" | cut -d' ' -f1)"
            echo "sha256_echo=$(sha256sum "$ECHO" | cut -d' ' -f1)"
            echo "sha256_p2=$(sha256sum "$P2" | cut -d' ' -f1)"
          } | tee "$RUNNER_TEMP/chromium-admin-e2e-shas.txt"
      - name: P1 admin opcode E2E (real stack)
        env:
          TMPDIR: ${{ runner.temp }}
          SKRYNIA_KERNEL_BIN: ${{ steps.shas.outputs.kernel }}
          SKRYNIA_KERNEL_SHA256: ${{ steps.shas.outputs.kernel_sha }}
          SKRYNIA_P0_WASM: ${{ steps.shas.outputs.p0 }}
          SKRYNIA_P0_SHA256: ${{ steps.shas.outputs.p0_sha }}
          SKRYNIA_P1_WASM: ${{ steps.shas.outputs.p1 }}
          SKRYNIA_P1_SHA256: ${{ steps.shas.outputs.p1_sha }}
          SKRYNIA_ECHO_GUEST: ${{ steps.shas.outputs.echo }}
          SKRYNIA_ECHO_SHA256: ${{ steps.shas.outputs.echo_sha }}
