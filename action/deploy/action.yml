name: Deploy an application through Skrynia HTTP
description: Build on the CI runner and atomically publish immutable releases through Skrynia object HTTP endpoints.
inputs:
  url:
    description: Skrynia base HTTP URL, including any path prefix
    required: true
  token:
    description: Scoped Skrynia grant user token; requires create, modify and list
    required: true
  namespace:
    description: Application name (legacy compatible)
    required: true
  subdir:
    description: GitHub checkout subdirectory with a Makefile build target
    default: .
  repo:
    description: GitHub source URL; defaults to the current checkout
    required: false
  commit:
    description: Full Git SHA; defaults to the GitHub Actions checkout SHA
    required: false
  builder:
    description: Optional OCI image used to build locally on the GitHub runner
    required: false
  directory:
    description: Built artifacts directory, relative to subdir
    default: build
outputs:
  release:
    description: Immutable release identifier
    value: ${{ steps.upload.outputs.release }}
  commit:
    description: Git commit associated with this exact release
    value: ${{ steps.upload.outputs.commit }}
  url:
    description: Public browser entrypoint served by Skrynia itself
    value: ${{ steps.upload.outputs.url }}
runs:
  using: composite
  steps:
    - id: build
      shell: bash
      env:
        SKRYNIA_APP_NAME: ${{ inputs.namespace }}
        SKRYNIA_SOURCE_REPO: ${{ inputs.repo }}
        SKRYNIA_SOURCE_COMMIT: ${{ inputs.commit }}
        SKRYNIA_APP_SUBDIR: ${{ inputs.subdir }}
        SKRYNIA_BUILDER_IMAGE: ${{ inputs.builder }}
        SKRYNIA_BUILD_OUTPUT: ${{ inputs.directory }}
      run: bash "${{ github.action_path }}/build.sh"
    - id: upload
      shell: bash
      env:
        SKRYNIA_URL: ${{ inputs.url }}
        SKRYNIA_TOKEN: ${{ inputs.token }}
        SKRYNIA_APP_NAME: ${{ inputs.namespace }}
        SKRYNIA_SOURCE_REPO: ${{ inputs.repo }}
        SKRYNIA_APP_SUBDIR: ${{ inputs.subdir }}
        SKRYNIA_BUILT_DIRECTORY: ${{ steps.build.outputs.directory }}
        SKRYNIA_BUILT_COMMIT: ${{ steps.build.outputs.commit }}
      run: bash "${{ github.action_path }}/upload.sh"
