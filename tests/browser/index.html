<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Skrynia Tools Wasm browser integration</title>
<body data-result="pending">
<script type="module">
import init, { BrowserClient, sha256Hex } from "../../dist/skrynia-wasm/skrynia_tools.js";
function check(ok, message) { if (!ok) throw new Error(message); }
try {
  await init();
  const read = "544e62cee8033709e389e5b2755343d0d0fa8c4850215cfb6331717e80d1aea3";
  const write = "2a".repeat(32);
  for (const url of [
    `http://acc:secret@${location.host}/`,
    `http://acc@${location.host}/`,
    `${location.origin}/?user=acc`,
    `${location.origin}/#fragment`,
    "javascript:alert(1)"
  ]) {
    let rejected = false;
    try { new BrowserClient(url, "test-edge", read, write); }
    catch (_) { rejected = true; }
    check(rejected, "reject unsafe base URL: " + url);
  }
  const client = new BrowserClient(location.origin + "/_skrynia/", "test-edge", read, write);
  const input = new TextEncoder().encode("hello wasm");
  check(await client.get("test.object") === undefined, "missing read");
  let partialAccepted = false;
  try { await client.get("test.partial"); partialAccepted = true; }
  catch (_) { /* 206 is not a complete object. */ }
  check(!partialAccepted, "partial HTTP response must not be trusted as full object");
  let acceptedAsCommitted = false;
  try { await client.create("test.accepted", input); acceptedAsCommitted = true; }
  catch (_) { /* 202 means unconfirmed, not created. */ }
  check(!acceptedAsCommitted, "202 cannot be treated as committed create");
  check(await client.create("test.object", input), "create");
  check(!(await client.create("test.object", input)), "create conflict");
  const old = await client.get("test.object");
  check(new TextDecoder().decode(old) === "hello wasm", "public bytes");
  check(!(await client.replace("test.object", input, "0".repeat(64))), "CAS mismatch");
  check(await client.replace("test.object", input, sha256Hex(old)), "CAS success");
  const reader = new BrowserClient(location.origin + "/_skrynia/", "test-edge", read);
  check(new TextDecoder().decode(await reader.get("test.object")) === "hello wasm", "read-only authority");
  let denied = false;
  try { await reader.create("test.unauthorized", input); } catch (_) { denied = true; }
  check(denied, "read-only client cannot write");
  await client.initializeLog("test.log");
  const operationId = "0123456789abcdef0123456789abcdef";
  const first = await client.appendLog("test.log", operationId, input);
  check(first === 1n, "initial append position");
  check(await client.appendLog("test.log", operationId, input) === 1n, "append idempotency");
  const entries = JSON.parse(await client.readLog("test.log", 1n, 5));
  check(entries.length === 1 && entries[0].position === 1, "log reading");
  await client.initializeLog("test.concurrency");
  const concurrentId = "11111111111111111111111111111111";
  const attempts = await Promise.all(Array.from({length: 8},
    () => client.appendLog("test.concurrency", concurrentId, input)));
  check(attempts.every(n => n === 1n), "concurrent idempotent append");
  const uniqueEntries = JSON.parse(await client.readLog("test.concurrency", 1n, 8));
  check(uniqueEntries.length === 1, "no duplicate slots from concurrent retries");
  check(await client.delete("test.object", sha256Hex(input)), "conditional delete");
  document.body.dataset.result = "pass";
} catch (error) {
  document.body.dataset.result = "fail";
  document.body.textContent = String(error);
}
</script>
</body>
</html>
