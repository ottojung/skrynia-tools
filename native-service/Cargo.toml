[package]
name = "skrynia-native-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-or-later"

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
cb-guest = []

[dependencies]
sha2 = "0.10"
wasmi = { version = "2.0.3", default-features = false, features = ["std", "validate"] }

[dev-dependencies]
wat = "1.263"
