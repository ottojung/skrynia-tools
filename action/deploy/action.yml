name: Deploy a GitHub app with Skrynia Tools
description: Build and atomically publish a GitHub repository subdirectory on a Skrynia static host over SSH.
inputs:
  host:
    description: SSH hostname or IPv4 address of the authorized static host
    required: true
  port:
    description: SSH port on the authorized hosting machine
    required: false
    default: '22'
  user:
    description: SSH deployment account
    required: true
  ssh-private-key:
    description: Private SSH deployment key (GitHub secret)
    required: true
  known-hosts:
    description: Trusted SSH host-key record; no TOFU or host-key skipping
    required: true
  name:
    description: Static application name (alias for namespace)
    required: false
  namespace:
    description: App name, as in the legacy Skrynia deployment action
    required: false
  apps-dir:
    description: Hosting path accessible by skrynia-tools on the remote machine
    required: true
  repo:
    description: GitHub repository URL; defaults to the workflow's source repository
    required: false
  subdir:
    description: Monorepo subdirectory containing the Makefile
    required: false
    default: .
  commit:
    description: Full Git SHA; defaults to workflow SHA only for the workflow source repo
    required: false
  builder-image:
    description: Rootless Podman builder image with Make and application dependencies
    required: false
  builder:
    description: Alias for builder-image, matching the legacy deployment action
    required: false
  base-path:
    description: Externally served app URL prefix, for action path output only
    required: false
    default: /apps
outputs:
  release:
    description: Immutable release identifier
    value: ${{ steps.deploy.outputs.release }}
  commit:
    description: Exact deployed commit
    value: ${{ steps.deploy.outputs.commit }}
  path:
    description: Static app URL path on the hosting origin
    value: ${{ steps.deploy.outputs.path }}
runs:
  using: composite
  steps:
    - id: deploy
      shell: bash
      env:
        SKRYNIA_HOST: ${{ inputs.host }}
        SKRYNIA_USER: ${{ inputs.user }}
        SKRYNIA_SSH_PORT: ${{ inputs.port }}
        SKRYNIA_SSH_KEY: ${{ inputs.ssh-private-key }}
        SKRYNIA_KNOWN_HOSTS: ${{ inputs.known-hosts }}
        SKRYNIA_APP_NAME: ${{ inputs.name }}
        SKRYNIA_NAMESPACE: ${{ inputs.namespace }}
        SKRYNIA_APPS_DIR: ${{ inputs.apps-dir }}
        SKRYNIA_REPO: ${{ inputs.repo }}
        SKRYNIA_SUBDIR: ${{ inputs.subdir }}
        SKRYNIA_COMMIT: ${{ inputs.commit }}
        SKRYNIA_BUILDER_IMAGE: ${{ inputs.builder-image }}
        SKRYNIA_BUILDER: ${{ inputs.builder }}
        SKRYNIA_PUBLIC_BASE_PATH: ${{ inputs.base-path }}
      run: bash "${{ github.action_path }}/deploy.sh"
